services:
  postgres:
    image: postgres:16-alpine
    container_name: greetings-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: greetings
      POSTGRES_USER: greetings
      POSTGRES_PASSWORD: greetings
    volumes:
      - greetings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greetings -d greetings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  greetings_pgdata:
