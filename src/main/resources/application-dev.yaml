spring:
  datasource:
    url: jdbc:h2:mem:meeting-rooms-dev;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  web:
    error:
      include-binding-errors: always
      include-message: always

logging:
  level:
    root: INFO
    com.wachayathorn.greetings_spring_boot: INFO

app:
  error:
    include-details: true
  time:
    zone: Asia/Bangkok
  auth:
    jwt-secret: dev-jwt-secret-at-least-32-characters
    session-duration: PT24H
