spring:
  application:
    name: greetings-spring-boot
  datasource:
    url: jdbc:postgresql://localhost:5432/greetings
    username: greetings
    password: greetings
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
