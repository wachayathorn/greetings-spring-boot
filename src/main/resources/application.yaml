spring:
  application:
    name: greetings-spring-boot
  profiles:
    default: local

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Bangkok

  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Bangkok
  web:
    error:
      include-stacktrace: never

app:
  error:
    include-details: false
  time:
    zone: Asia/Bangkok
  auth:
    jwt-secret: change-me-in-real-env-min-32-chars!!
    session-duration: PT24H
