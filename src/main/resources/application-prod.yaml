spring:
  datasource:
    url: jdbc:h2:mem:meeting-rooms-prod;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  web:
    error:
      include-binding-errors: never
      include-message: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.wachayathorn.greetings_spring_boot: INFO

app:
  error:
    include-details: false
  time:
    zone: Asia/Bangkok
  auth:
    jwt-secret: prod-jwt-secret-at-least-32-characters
    session-duration: PT24H
