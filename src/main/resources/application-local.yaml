spring:
  datasource:
    url: jdbc:h2:mem:meeting-rooms-local;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    com.wachayathorn.greetings_spring_boot: DEBUG

app:
  error:
    include-details: true
